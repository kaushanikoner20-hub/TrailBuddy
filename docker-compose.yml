# Runs the TrailBuddy app only. Start Ollama on your host first (see docs/SETUP.md).
services:
  trailbuddy:
    build: .
    ports:
      - "3001:3001"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"